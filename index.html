<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipass Language Hub – Lessons</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1d2640;--muted:#5b6785;--line:#e3e8f2;--brand:#2f6fdf;--shadow:0 6px 24px #1d264014}
@media (prefers-color-scheme:dark){:root{--bg:#10162a;--card:#1a2340;--ink:#eef2fb;--muted:#a8b3d1;--line:#2a3560;--shadow:0 6px 24px #0006}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Segoe UI",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 48px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:54px;height:54px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:28px;flex:none}
h1{margin:0;font-size:1.7em;line-height:1.15}
.sub{color:var(--muted);margin:2px 0 0}
.hello{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hello b{font-size:1.1em}
.search{flex:1;min-width:200px;font:inherit;padding:.55em .9em;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:22px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.lesson:hover,a.lesson:focus-visible{transform:translateY(-4px);box-shadow:0 12px 30px #1d264026}
.cover{height:130px;display:grid;place-items:center;font-size:64px;position:relative}
.tag{position:absolute;top:10px;left:10px;background:#ffffffd9;color:#1d2640;font-size:13px;line-height:1.5;font-weight:700;padding:.2em .7em;border-radius:999px}
.done{position:absolute;top:10px;right:10px;background:#2e8b57;color:#fff;font-size:13px;line-height:1.5;font-weight:700;padding:.2em .7em;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font-size:1.25em}
.body p{margin:0;color:var(--muted);font-size:.95em}
.words{display:flex;flex-wrap:wrap;gap:5px}
.words span{font-size:.8em;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.1em .6em}
.go{margin-top:auto;align-self:flex-start;background:var(--brand);color:#fff;font-weight:700;border-radius:999px;padding:.5em 1.1em}
.soon{opacity:.6}.soon .go{background:var(--muted)}
.empty{color:var(--muted);text-align:center;margin-top:30px}
footer{margin-top:40px;color:var(--muted);font-size:.85em;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📚</div>
    <div>
      <h1>Ipass Language Hub</h1>
      <p class="sub">Choose a lesson. Learn the words, then complete the missions!</p>
    </div>
  </header>

  <div class="hello">
    <b>👋 Hello!</b>
    <input class="search" id="q" type="search" placeholder="🔎 Find a lesson or a word…" aria-label="Find a lesson">
  </div>

  <main class="grid" id="list"></main>
  <p class="empty" id="none" hidden>No lesson found. Try another word.</p>

  <footer>Ipass Language Hub</footer>
</div>

<script>
/* =========================================================
   TEACHER: HOW TO ADD A NEW LESSON
   1. Upload the lesson's .html file to this GitHub repository
      (Add file > Upload files). Use a short name with no spaces,
      for example: animals.html
   2. Copy one { ... } block below, paste it at the end of the list,
      and change the details. "file" must match the file name exactly.
   3. To show a lesson that is not ready yet, write file: ""  (it shows "Coming soon").
   Colours: any two colours for the picture background.
   ========================================================= */
const LESSONS = [
  {
    title: "Jungle Words",
    file: "jungle.html",
    emoji: "🌿🐒",
    colors: ["#2f8f5b", "#a6d96a"],
    level: "Level 3",
    about: "Animals and people in the jungle, and how to keep it safe. Practise with pictures, listening and writing.",
    words: ["jungle", "orang-utan", "ranger", "visitor", "rhino", "beautiful", "polluted", "dangerous", "cut down the trees", "take a photograph"]
  },
  {
    title: "Space Vocabulary",
    file: "space.html",
    emoji: "🚀🪐",
    colors: ["#0b1533", "#3d5bd9"],
    level: "Level 3",
    about: "Life in space: slides plus 6 missions – vocabulary, spelling, listening, speaking, reading and writing.",
    words: ["astronaut", "planet", "space", "space station", "float", "telescope", "sleeping bag", "do a spacewalk", "wear a special suit"]
  }
];

/* ---------- page (no need to change below) ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function visited(f){ try { return localStorage.getItem("visited:" + f) === "1"; } catch(e){ return false; } }
function card(L){
  const ready = !!L.file;
  const tagName = ready ? "a" : "div";
  const href = ready ? ` href="${esc(L.file)}"` : "";
  return `<${tagName} class="lesson${ready ? "" : " soon"}"${href} data-file="${esc(L.file)}">
    <div class="cover" style="background:linear-gradient(135deg,${L.colors[0]},${L.colors[1]})">
      ${L.level ? `<span class="tag">${esc(L.level)}</span>` : ""}
      ${ready && visited(L.file) ? `<span class="done">✓ Opened</span>` : ""}
      <span>${L.emoji || "📘"}</span>
    </div>
    <div class="body">
      <h2>${esc(L.title)}</h2>
      <p>${esc(L.about || "")}</p>
      ${L.words && L.words.length ? `<div class="words">${L.words.slice(0, 9).map(w => `<span>${esc(w)}</span>`).join("")}</div>` : ""}
      <span class="go">${ready ? "Start lesson ›" : "Coming soon"}</span>
    </div>
  </${tagName}>`;
}
function show(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = LESSONS.filter(L => !q || [L.title, L.about, L.level, ...(L.words || [])].join(" ").toLowerCase().includes(q));
  document.getElementById("list").innerHTML = list.map(card).join("");
  document.getElementById("none").hidden = list.length > 0;
}
document.getElementById("q").addEventListener("input", show);
document.getElementById("list").addEventListener("click", e => {
  const a = e.target.closest("a.lesson");
  if (a) try { localStorage.setItem("visited:" + a.dataset.file, "1"); } catch(_){}
});
show();
</script>
</body>
</html>
