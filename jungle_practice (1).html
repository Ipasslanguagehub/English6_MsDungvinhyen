<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Words – Practice</title>
<style>
:root{--bg:#eef4ea;--card:#fff;--ink:#1e2b24;--green:#1f5a3c;--soft:#cfe3c8;--orange:#d9822b;--ok:#2e8b57;--bad:#c0392b;--muted:#55665b}
@media (prefers-color-scheme:dark){:root{--bg:#14211a;--card:#1d2f25;--ink:#e8f0ea;--green:#8fd1a8;--soft:#2b4636;--orange:#f0a258;--ok:#5fcf8f;--bad:#ff7b6b;--muted:#a3b5aa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Arial,sans-serif}
header{background:var(--green);color:#fff;padding:14px 18px}@media (prefers-color-scheme:dark){header{background:#0e1913;color:var(--green)}}
h1{margin:0;font:700 26px Georgia,serif}main{max-width:960px;margin:0 auto;padding:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
nav button{flex:1;min-width:140px;padding:12px;border:2px solid var(--green);background:var(--card);color:var(--green);border-radius:12px;font:700 16px Arial;cursor:pointer}
nav button[aria-selected=true]{background:var(--green);color:#fff}@media (prefers-color-scheme:dark){nav button[aria-selected=true]{background:var(--green);color:#0e1913}}
.panel{display:none}.panel.on{display:block}
.tip{margin:0 0 10px;color:var(--muted)}.msg{min-height:1.6em;font-weight:700;margin:8px 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.word,.pic,.chip,.btn,.gap{font:inherit;cursor:pointer;border-radius:12px}
.word{padding:14px 8px;border:2px solid var(--soft);background:var(--card);color:var(--ink);font-weight:700;font-size:18px}
.pic{padding:0;border:3px solid var(--soft);background:var(--card);overflow:hidden;aspect-ratio:4/3}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.sel{border-color:var(--orange)!important;box-shadow:0 0 0 3px var(--orange)}
.done{opacity:.45;border-color:var(--ok)!important;pointer-events:none}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
h2{font:700 20px Georgia,serif;color:var(--green);margin:18px 0 8px}
.card{background:var(--card);border-radius:16px;padding:16px;text-align:center}
.card img{max-width:100%;max-height:260px;border-radius:12px}
.vi{font-size:20px;font-weight:700;color:var(--green);margin:8px 0}
.letters{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;margin:14px 0}
.wd{display:flex;gap:4px}.ch,.letters input{width:38px;height:46px;font:700 24px Arial;text-align:center;border-radius:8px;border:2px solid var(--soft);background:var(--bg);color:var(--ink);padding:0;display:flex;align-items:center;justify-content:center}
.letters input{border-color:var(--orange);background:var(--card)}.letters input.ok{border-color:var(--ok);background:#d9f2e3;color:#1e2b24}.letters input.bad{border-color:var(--bad);background:#fbe0dc;color:#1e2b24}
.btn{padding:11px 18px;border:2px solid var(--green);background:var(--green);color:#fff;font-weight:700;margin:4px}
@media (prefers-color-scheme:dark){.btn{color:#0e1913}}
.btn.alt{background:transparent;color:var(--green)}
.gwrap{display:grid;grid-template-columns:1fr 240px;gap:18px;align-items:start}
.gwrap ol{grid-column:1;grid-row:1;margin:0}
.bank{grid-column:2;grid-row:1;position:sticky;top:12px;display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--soft);border-radius:16px;padding:12px;max-height:calc(100vh - 24px);overflow:auto}
.bank h3{margin:0 0 4px;font:700 16px Georgia,serif;color:var(--green)}
@media (max-width:640px){.gwrap{grid-template-columns:1fr}.gwrap ol{grid-column:1;grid-row:2}.bank{grid-column:1;grid-row:1;flex-direction:row;flex-wrap:wrap;top:0;padding:8px;gap:6px;max-height:34vh;z-index:2}.bank h3{display:none}.chip{padding:6px 10px;font-size:15px}}
.chip{padding:9px 14px;border:2px solid var(--green);background:var(--card);color:var(--green);font-weight:700}
.chip.used{opacity:.4;text-decoration:line-through;pointer-events:none}
ol{padding-left:26px}li{margin:14px 0;font-size:20px}
.gap{min-width:150px;padding:2px 10px;border:2px dashed var(--orange);background:var(--card);color:var(--ink);font-weight:700;font-size:20px;min-height:36px;vertical-align:middle}
.gap.ok{border:2px solid var(--ok);color:var(--ok)}
.end{font:700 22px Georgia,serif;color:var(--ok);text-align:center;margin:14px}
.sp{background:none;border:2px solid var(--green);color:var(--green);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer}
</style></head><body>
<header><h1>🌿 Jungle Words – Practice</h1></header>
<main>
<nav role="tablist"><button role="tab" aria-selected="true" data-t="m">1. Match <span id="sm"></span></button><button role="tab" aria-selected="false" data-t="l">2. Missing letters <span id="sl"></span></button><button role="tab" aria-selected="false" data-t="g">3. Fill the gap <span id="sg"></span></button></nav>

<section id="m" class="panel on"><p class="tip">Tap a word. Then tap its picture.</p><div class="grid" id="mw"></div><div class="msg" id="mm" aria-live="polite"></div><div class="grid" id="mp"></div><div id="me"></div></section>

<section id="l" class="panel"><p class="tip">Type the missing letters. Tap 🔊 to listen.</p><div class="card"><img id="li" alt=""><div class="vi" id="lv"></div><button class="sp" id="ls" aria-label="Listen">🔊</button><div class="letters" id="lw"></div><div class="msg" id="lm" aria-live="polite"></div><button class="btn" id="lc">Check</button><button class="btn alt" id="la">Show answer</button><button class="btn alt" id="ln">Next ➜</button></div><div id="le"></div></section>

<section id="g" class="panel"><p class="tip">Tap a word. Then tap the gap in the sentence.</p><div class="msg" id="gm" aria-live="polite"></div><div class="gwrap"><div class="bank" id="gb"></div><ol id="gs"></ol></div><div id="ge"></div></section>
</main>

const $=s=>document.querySelector(s),N=W.length,mix=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const say=i=>{try{new Audio(AUD[i]).play()}catch(e){}};
const shake=e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')};
const score={m:0,l:0,g:0},show=k=>$('#s'+k).textContent='('+score[k]+'/'+N+')';
const msg=(id,t,c)=>{const e=$(id);e.textContent=t;e.className='msg '+(c||'')};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x==b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==b.dataset.t))});
const endBox=(id,k,fn)=>{$(id).innerHTML=score[k]==N?'<div class="end">🎉 Great job! '+N+'/'+N+'</div>':'';if(score[k]==N){const b=document.createElement('button');b.className='btn';b.textContent='Play again';b.onclick=fn;$(id).appendChild(b)}};

/* 1. MATCH */
let sel=null;
function initM(){score.m=0;show('m');sel=null;msg('#mm','');$('#me').innerHTML='';
 $('#mw').innerHTML='';$('#mp').innerHTML='';
 mix([...Array(N).keys()]).forEach(i=>{const b=document.createElement('button');b.className='word';b.textContent=W[i].w;b.dataset.i=i;b.onclick=()=>pickM('w',i,b);$('#mw').appendChild(b)});
 mix([...Array(N).keys()]).forEach((i,n)=>{const b=document.createElement('button');b.className='pic';b.dataset.i=i;b.setAttribute('aria-label','Picture '+(n+1));b.innerHTML='<img alt="" src="'+IMG[i]+'">';b.onclick=()=>pickM('p',i,b);$('#mp').appendChild(b)})}
function pickM(t,i,el){
 if(!sel||sel.t==t){if(sel)sel.el.classList.remove('sel');sel={t,i,el};el.classList.add('sel');return}
 const ok=sel.i==i;
 if(ok){[sel.el,el].forEach(x=>{x.classList.remove('sel');x.classList.add('done')});score.m++;show('m');say(i);msg('#mm','✔ Yes! '+W[i].w,'ok');sel=null;endBox('#me','m',initM)}
 else{shake(el);shake(sel.el);msg('#mm','Try again.','bad');sel.el.classList.remove('sel');sel=null}}

/* 2. MISSING LETTERS */
let ord=[],pos=0,gotL=false;
function mask(i){const w=W[i].w,out=[];let hid=0,j=0;for(const wd of w.split(' ')){for(let k=0;k<wd.length;k++,j++){const c=wd[k];out.push(k>0&&/[a-z]/.test(c)&&((j*7+i*3)%5<2)?(hid++,0):1)}out.push(2)}out.pop();
 if(!hid){const k=w.length-2;out[k]=out[k]===1?0:out[k]}return out}
function initL(){score.l=0;show('l');ord=mix([...Array(N).keys()]);pos=0;$('#le').innerHTML='';$('#lc').style.display=$('#la').style.display=$('#ln').style.display='';showL()}
function showL(){const i=ord[pos];gotL=false;$('#li').src=IMG[i];$('#lv').textContent=W[i].vi+'  ('+(pos+1)+'/'+N+')';msg('#lm','');
 const m=mask(i),box=$('#lw');box.innerHTML='';let g=document.createElement('div');g.className='wd';box.appendChild(g);
 [...W[i].w].forEach((c,k)=>{if(c==' '){g=document.createElement('div');g.className='wd';box.appendChild(g);return}
  let e;if(m[k]==0){e=document.createElement('input');e.maxLength=1;e.dataset.a=c;e.setAttribute('aria-label','missing letter');e.autocomplete='off';e.autocapitalize='off';
   e.oninput=()=>{e.className='';if(e.value){let n=e.nextElementSibling;while(n&&n.tagName!='INPUT')n=n.nextElementSibling;if(!n){const all=[...box.querySelectorAll('input')];n=all[all.indexOf(e)+1]}n&&n.focus()}};
   e.onkeydown=ev=>{if(ev.key=='Backspace'&&!e.value){const all=[...box.querySelectorAll('input')];const p=all[all.indexOf(e)-1];p&&p.focus()}if(ev.key=='Enter')$('#lc').click()}}
  else{e=document.createElement('div');e.className='ch';e.textContent=c}g.appendChild(e)});
 const f=box.querySelector('input');f&&f.focus()}
$('#ls').onclick=()=>say(ord[pos]);
$('#lc').onclick=()=>{const ins=[...$('#lw').querySelectorAll('input')];let all=true;ins.forEach(e=>{const r=e.value.toLowerCase()==e.dataset.a;e.className=r?'ok':'bad';if(!r)all=false});
 if(all){if(!gotL){gotL=true;score.l++;show('l')}msg('#lm','✔ Well done!','ok');say(ord[pos])}else{msg('#lm','Check the red letters.','bad');shake($('#lw'))}};
$('#la').onclick=()=>{$('#lw').querySelectorAll('input').forEach(e=>{e.value=e.dataset.a;e.className='ok'});msg('#lm',W[ord[pos]].w,'ok');say(ord[pos])};
$('#ln').onclick=()=>{if(pos<N-1){pos++;showL()}else{$('#lc').style.display=$('#la').style.display=$('#ln').style.display='none';msg('#lm','Finished! Score: '+score.l+'/'+N,'ok');endBox('#le','l',initL);if(score.l<N){const b=document.createElement('button');b.className='btn';b.textContent='Try again';b.onclick=initL;$('#le').appendChild(b)}}};

/* 3. FILL THE GAP */
let chip=null;
function initG(){score.g=0;show('g');chip=null;msg('#gm','');$('#ge').innerHTML='';$('#gb').innerHTML='<h3>Word bank</h3>';$('#gs').innerHTML='';
 mix([...Array(N).keys()]).forEach(i=>{const b=document.createElement('button');b.className='chip';b.textContent=W[i].w;b.onclick=()=>{if(chip)chip.el.style.outline='';chip={i,el:b};b.style.outline='3px solid var(--orange)'};$('#gb').appendChild(b)});
 mix([...Array(N).keys()]).forEach(i=>{const li=document.createElement('li'),g=document.createElement('button');g.className='gap';g.setAttribute('aria-label','gap');
  g.onclick=()=>{if(!chip||g.classList.contains('ok'))return;if(chip.i==i){g.textContent=W[i].w;g.classList.add('ok');chip.el.classList.add('used');chip.el.style.outline='';chip=null;score.g++;show('g');say(i);msg('#gm','✔ Good!','ok');endBox('#ge','g',initG)}else{shake(g);msg('#gm','Not this one. Try again.','bad')}};
  li.append(W[i].s[0],g,W[i].s[1]);$('#gs').appendChild(li)})}
initM();initL();initG();
</script></body></html>
